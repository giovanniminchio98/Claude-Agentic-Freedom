name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/dynamic-feeds]
  schedule:
    # Rebuild daily at 06:00 UTC — picks up fresh arXiv papers & re-deploys
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (includes arXiv paper fetch)
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
